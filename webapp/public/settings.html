<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Dashboard - Paramètres</title>
  <meta name="description" content="MQTT broker settings configuration">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- SIDEBAR -->
    <nav class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">📡</div>
        <div>
          <h1>IoT Dashboard<span class="brand-sub">ESP32 Network</span></h1>
        </div>
      </div>

      <div class="nav-section">
        <div class="nav-section-title">Monitoring</div>
        <a href="/" class="nav-link">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="/ble.html" class="nav-link">
          <span class="nav-icon">📱</span>
          <span>Appareils BLE</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-title">Configuration</div>
        <a href="/manage.html" class="nav-link">
          <span class="nav-icon">➕</span>
          <span>Gestion ESP32</span>
        </a>
        <a href="/settings.html" class="nav-link active">
          <span class="nav-icon">⚙️</span>
          <span>Paramètres</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-title">Avancé</div>
        <a href="/map.html" class="nav-link">
          <span class="nav-icon">🗺️</span>
          <span>Carte</span>
        </a>
      </div>

      <div class="mqtt-status" id="mqtt-status">
        <span class="mqtt-status-dot disconnected" id="mqtt-dot"></span>
        <span class="mqtt-status-text" id="mqtt-text">MQTT Déconnecté</span>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="page-header">
        <h2>⚙️ Paramètres</h2>
        <p>Configuration de la connexion au broker MQTT</p>
      </div>

      <!-- CONNECTION STATUS -->
      <div class="connection-status disconnected" id="connection-status">
        <span class="mqtt-status-dot disconnected" id="settings-dot"></span>
        <div>
          <strong id="connection-label">Déconnecté</strong>
          <div style="font-size: 12px; color: var(--text-secondary);" id="connection-detail">Aucune connexion MQTT active</div>
        </div>
      </div>

      <!-- MQTT SETTINGS FORM -->
      <div class="form-card">
        <h3 style="margin-bottom: 24px; font-size: 18px;">🔧 Configuration MQTT</h3>
        <form id="settings-form">
          <div class="form-row">
            <div class="form-group">
              <label for="mqtt-broker">Adresse du Broker</label>
              <input type="text" id="mqtt-broker" placeholder="Ex: 172.18.32.43" required>
            </div>
            <div class="form-group">
              <label for="mqtt-port">Port</label>
              <input type="number" id="mqtt-port" placeholder="1883" value="1883" required min="1" max="65535">
            </div>
          </div>
          <div style="display: flex; gap: 12px; margin-top: 8px;">
            <button type="submit" class="btn btn-primary">💾 Sauvegarder & Reconnecter</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script>
    // === Settings page logic ===
    const settingsForm = document.getElementById('settings-form');
    const connectionStatus = document.getElementById('connection-status');
    const settingsDot = document.getElementById('settings-dot');
    const connectionLabel = document.getElementById('connection-label');
    const connectionDetail = document.getElementById('connection-detail');

    // Load current settings
    fetch('/api/settings').then(r => r.json()).then(data => {
      document.getElementById('mqtt-broker').value = data.mqtt.broker;
      document.getElementById('mqtt-port').value = data.mqtt.port;
      updateConnectionUI(data.mqttConnected, data.mqtt.broker, data.mqtt.port);
    });

    function updateConnectionUI(connected, broker, port) {
      if (connected) {
        connectionStatus.className = 'connection-status connected';
        settingsDot.className = 'mqtt-status-dot connected';
        connectionLabel.textContent = 'Connecté';
        connectionDetail.textContent = `Broker: ${broker}:${port}`;
      } else {
        connectionStatus.className = 'connection-status disconnected';
        settingsDot.className = 'mqtt-status-dot disconnected';
        connectionLabel.textContent = 'Déconnecté';
        connectionDetail.textContent = broker ? `Impossible de joindre ${broker}:${port}` : 'Aucune connexion MQTT active';
      }
    }

    settingsForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const broker = document.getElementById('mqtt-broker').value.trim();
      const port = parseInt(document.getElementById('mqtt-port').value);

      try {
        const res = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ broker, port })
        });
        const data = await res.json();
        if (res.ok) {
          showToast('⚙️ Configuration sauvegardée, reconnexion en cours...', 'info');
        } else {
          showToast('❌ ' + data.error, 'error');
        }
      } catch (err) {
        showToast('❌ Erreur réseau', 'error');
      }
    });

    // Listen for MQTT status updates
    socket.on('mqtt:status', (data) => {
      const brokerUrl = data.broker || '';
      const parts = brokerUrl.replace('mqtt://', '').split(':');
      updateConnectionUI(data.connected, parts[0] || '', parts[1] || '');
    });
  </script>
</body>
</html>
